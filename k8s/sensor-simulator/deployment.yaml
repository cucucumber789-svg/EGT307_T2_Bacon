apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-simulator
  labels:
    app: sensor-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-simulator
  template:
    metadata:
      labels:
        app: sensor-simulator
    spec:
      containers:
        - name: sensor-simulator
          image: sensor-simulator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATASET_PATH
              value: "/data/validation_data.example.csv"
            - name: DATA_INGESTION_URL
              value: "http://data-ingestion-service/api/ingest/reading"
          volumeMounts:
            - name: dataset
              mountPath: /data
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: dataset-pvc
