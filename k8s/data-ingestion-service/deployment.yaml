apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion-service
  labels:
    app: data-ingestion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-ingestion-service
  template:
    metadata:
      labels:
        app: data-ingestion-service
    spec:
      initContainers:
        - name: seed-dataset
          # Seeds the shared dataset PVC with the raw example file so the
          # ingestion service has data to clean via POST /api/ingest/file.
          image: dataset-seed:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "[ -f /data/sensor_data.example.csv ] || cp /seed/sensor_data.example.csv /data/"]
          volumeMounts:
            - name: dataset
              mountPath: /data
      containers:
        - name: data-ingestion-service
          image: data-ingestion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: data-ingestion-service-config
          volumeMounts:
            - name: dataset
              mountPath: /data
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: dataset-pvc
      # TODO: Add resource limits, readiness/liveness probes
