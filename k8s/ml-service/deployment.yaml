apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  labels:
    app: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: ml-service-config
          volumeMounts:
            - name: dataset
              mountPath: /data
            - name: config-yaml
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: dataset-pvc
        - name: config-yaml
          configMap:
            name: app-config
      # TODO: Add resource limits, readiness/liveness probes
