# Local development environment
# Intention: Run all microservices together with a single command
# Usage: docker-compose up --build

services:
  env-validator:
    build:
      context: .
      dockerfile: components/env-validator/Dockerfile
    volumes:
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "/app/scripts/validate-env.sh"]
      interval: 5s
      timeout: 5s
      retries: 1

  backend-api:
    build:
      context: .
      dockerfile: components/backend-api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - ML_SERVICE_URL=http://ml-service:5001
      - NOTIFICATION_SERVICE_URL=http://notification-service:5002
    depends_on:
      env-validator:
        condition: service_healthy
      database:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: components/notification-service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      env-validator:
        condition: service_healthy

  data-ingestion-service:
    build:
      context: .
      dockerfile: components/data-ingestion-service/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - BACKEND_API_URL=http://backend-api:5000
      - DATA_DIR=/data
    volumes:
      - ./components/database:/data
    depends_on:
      env-validator:
        condition: service_healthy
      database:
        condition: service_started
      backend-api:
        condition: service_started

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./components/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  ml-service:
    build:
      context: .
      dockerfile: components/ml-service/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - DATASET_PATH=/data/sensor_data_cleaned.csv
    volumes:
      - ./components/database:/data
    depends_on:
      env-validator:
        condition: service_healthy
      data-ingestion-service:
        condition: service_started

  frontend:
    build: ./components/frontend
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend-api:5000/api/
      - NOTIFICATION_BASE_URL=http://notification-service:5002
    depends_on:
      env-validator:
        condition: service_healthy

  sensor-simulator:
    build:
      context: .
      dockerfile: components/sensor/Dockerfile
    environment:
      - DATASET_PATH=/data/validation_data.example.csv
      - DATA_INGESTION_URL=http://data-ingestion-service:5003/api/ingest/reading
    volumes:
      - ./components/database:/data
    depends_on:
      data-ingestion-service:
        condition: service_started
