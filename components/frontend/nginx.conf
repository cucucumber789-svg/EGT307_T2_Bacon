server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index html/dashboard.html;

    # Proxy /api/alerts to Notification Service (must come before the catch-all /api/)
    location = /api/alerts {
        proxy_pass ${NOTIFICATION_BASE_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All other /api/ requests go to Backend API
    location /api/ {
        proxy_pass ${API_BASE_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /html/dashboard.html;
    }
}
