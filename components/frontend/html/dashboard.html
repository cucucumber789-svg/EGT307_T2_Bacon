<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>BACON|DASHBOARD</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
        <nav>
            <ul id="navleft">
                <li>Bacon.Inc</li>
            </ul>
            <p id="conn-status">Connecting&hellip;</p>
        </nav>

        <main>
            <!-- Notification / alert panel. Driven by Notification Service
                 (GET /api/alerts); alerts are created by the Backend API
                 when the ML model flags an anomaly. -->
            <div id="note" data-state="pending">
                <p id="alert">Notification</p>
                <p id="alert-detail">Waiting for data&hellip;</p>
            </div>

            <div class="metrics">
                <div id="temperature">
                    <p class="metric-label">Temperature</p>
                    <p class="metric-value"><span id="temp-value">&mdash;</span><span class="unit">&deg;C</span></p>
                    <canvas id="temp-chart"></canvas>
                </div>

                <div id="hum">
                    <p class="metric-label" id="humt">Humidity</p>
                    <p class="metric-value"><span id="humidity-value">&mdash;</span><span class="unit">%RH</span></p>
                    <canvas id="humidity-chart"></canvas>
                </div>

                <div id="aq">
                    <p class="metric-label">Air Quality</p>
                    <p class="metric-value"><span id="aq-value">&mdash;</span><span class="unit" id="aq-unit"></span></p>
                    <canvas id="aq-chart"></canvas>
                </div>
            </div>

            <!-- ML Analysis panel. Shows severity meter, anomaly score,
                 and model status from the latest prediction. -->
            <div id="ml-status">
                <p class="metric-label">ML Analysis</p>
                <div class="ml-row">
                    <span class="ml-label">Severity</span>
                    <div class="severity-bar">
                        <div id="severity-fill" class="severity-fill"></div>
                    </div>
                    <span id="severity-value" class="ml-value">&mdash;</span>
                </div>
                <div class="ml-row">
                    <span class="ml-label">Anomaly Score</span>
                    <span id="anomaly-score" class="ml-value">&mdash;</span>
                </div>
                <div class="ml-row">
                    <span class="ml-label">Status</span>
                    <span id="ml-status-text" class="ml-value">&mdash;</span>
                </div>
            </div>
        </main>

        <!-- Chart.js draws the temperature/humidity/air-quality history on
             <canvas>. dashboard.js does the fetching + rendering. -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
        <script src="../js/dashboard.js"></script>
    </body>
</html>
