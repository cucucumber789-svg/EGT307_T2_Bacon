# Non-sensitive configuration — safe to commit to git.
# Secrets (tokens, passwords) stay in .env (gitignored).
# Each service reads this file at startup via its config.py.

anomaly_score_threshold: 0.05   # trigger Telegram notification when anomaly_score < -this value

ml_service:
  severity_steepness: 10.0
  contamination: 0.02
  n_estimators: 200
  absolute_max_temp: 50.0

sensor_simulator:
  send_interval_seconds: 3
  anomaly_rate: 0.05
